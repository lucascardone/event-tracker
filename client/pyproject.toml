[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "event-tracker-client"
version = "0.1.0"
description = "Cliente para el microservicio Event Tracker"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["event_tracker*"]